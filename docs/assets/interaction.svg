<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" role="img" aria-labelledby="interaction-title interaction-desc"><title id="interaction-title">AG-UI through the authenticated gateway</title><desc id="interaction-desc">Client A starts a conversation through Birbforge. Birbcrew returns events through Birbforge. Client B later resolves the same request by ID and version. Responses again pass through the gateway. The isolated first Birbcrew proof tests this contract without the full Birbforge app.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#91a59d"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#eef5f0}.label{font-size:19px;font-weight:650}.sub{font-size:14px;fill:#afc0b8}.box{fill:#16231f;stroke:#426458;stroke-width:1.5;rx:12}.line{fill:none;stroke:#91a59d;stroke-width:1.5;marker-end:url(#arrow)}.accent{fill:#c3ee91}</style><rect width="940" height="680" fill="#101a15"/><rect class="box" x="10" y="20" width="200" height="76"/><text class="label" x="28" y="50">Client A</text><text class="sub" x="28" y="75">Phone or browser</text><rect class="box" x="250" y="20" width="210" height="76"/><text class="label" x="268" y="50">Birbforge</text><text class="sub" x="268" y="75">Authenticated gateway</text><rect class="box" x="500" y="20" width="210" height="76"/><text class="label" x="518" y="50">Birbcrew</text><text class="sub" x="518" y="75">Durable conversation</text><rect class="box" x="750" y="20" width="180" height="76"/><text class="label" x="768" y="50">Client B</text><text class="sub" x="768" y="75">Second device</text><path d="M110 110V620M355 110V620M605 110V620M840 110V620" stroke="#31473d" stroke-dasharray="4 7" fill="none"/><path class="line" d="M110 155H355"/><text class="sub" x="120" y="142">Input + request ID</text><path class="line" d="M355 210H605"/><text class="sub" x="370" y="197">Authorized durable run</text><path class="line" d="M605 275H355"/><text class="sub" x="370" y="262">AG-UI events</text><path class="line" d="M355 330H110"/><text class="sub" x="120" y="317">Forward messages + state</text><path class="line" d="M840 405H355"/><text class="sub" x="430" y="392">Answer same request by ID + version</text><path class="line" d="M355 465H605"/><text class="sub" x="370" y="452">Authorized resolution</text><path class="line" d="M605 525H355"/><text class="sub" x="370" y="512">Authoritative state</text><path class="line" d="M355 585H840"/><text class="sub" x="430" y="572">Snapshot + subsequent events to Client B</text><text class="accent" x="20" y="655" font-size="17">Disconnect ≠ cancel. Client state ≠ approval.</text></svg>