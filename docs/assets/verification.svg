<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 535" role="img" aria-labelledby="verification-title verification-desc"><title id="verification-title">Verification reservation lifecycle</title><desc id="verification-desc">An immutable request waits for staging, then deploys, checks identity, verifies journeys, persists evidence and cleans up. Only confirmed cleanup releases staging. Worker loss or uncertain ownership quarantines the environment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#91a59d"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#eef5f0}.label{font-size:19px;font-weight:650}.sub{font-size:14px;fill:#afc0b8}.box{fill:#16231f;stroke:#426458;stroke-width:1.5;rx:12}.line{fill:none;stroke:#91a59d;stroke-width:1.5;marker-end:url(#arrow)}.accent{fill:#c3ee91}</style><rect width="940" height="535" fill="#101a15"/><rect class="box" x="25" y="20" width="260" height="76"/><text class="label" x="43" y="50">Admit exact candidate</text><text class="sub" x="43" y="75">Commit + plan + policy revision</text><rect class="box" x="340" y="20" width="260" height="76"/><text class="label" x="358" y="50">Wait for staging</text><text class="sub" x="358" y="75">Birbforge Temporal workflow</text><rect class="box" x="655" y="20" width="260" height="76"/><text class="label" x="673" y="50">Reserve environment</text><text class="sub" x="673" y="75">Fence stale mutation attempts</text><rect class="box" x="655" y="175" width="260" height="76"/><text class="label" x="673" y="205">Deploy and identify</text><text class="sub" x="673" y="230">Pinned artifacts; observe revision</text><rect class="box" x="340" y="175" width="260" height="76"/><text class="label" x="358" y="205">Run journeys</text><text class="sub" x="358" y="230">Repository tests + native checks</text><rect class="box" x="25" y="175" width="260" height="76"/><text class="label" x="43" y="205">Persist evidence</text><text class="sub" x="43" y="230">Assertions + private artifacts</text><rect class="box" x="25" y="330" width="260" height="76"/><text class="label" x="43" y="360">Reconcile cleanup</text><text class="sub" x="43" y="385">Stop workers and remove fixtures</text><rect class="box" x="340" y="330" width="260" height="76"/><text class="label" x="358" y="360">Release or quarantine</text><text class="sub" x="358" y="385">Unknown stop keeps gate shut</text><rect class="box" x="655" y="330" width="260" height="76"/><text class="label" x="673" y="360">Evaluate delivery</text><text class="sub" x="673" y="385">Fresh evidence + separate approvals</text><path class="line" d="M285 58H340"/><path class="line" d="M600 58H655"/><path class="line" d="M785 96V175"/><path class="line" d="M655 213H600"/><path class="line" d="M340 213H285"/><path class="line" d="M155 251V330"/><path class="line" d="M285 368H340"/><path class="line" d="M600 368H655"/><text class="sub" x="25" y="465">The reservation spans deployment, Linux and Mac checks, evidence, and cleanup.</text><text class="accent" x="25" y="505" font-size="17">A passed assertion set does not excuse failed cleanup.</text></svg>