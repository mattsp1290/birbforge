<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">Factory component and delivery map</title><desc id="architecture-desc">Phone and browser use AG-UI through Forge to Crew. Crew reads scoped Beans notes. Temporal coordinates authors, candidate PR review and verification on shared k3s staging. Gates recheck approvals before existing CI deploys and the owner observes production health.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#91a59d"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#eef5f0}.label{font-size:19px;font-weight:650}.sub{font-size:14px;fill:#afc0b8}.box{fill:#16231f;stroke:#426458;stroke-width:1.5;rx:12}.line{fill:none;stroke:#91a59d;stroke-width:1.5;marker-end:url(#arrow)}.accent{fill:#c3ee91}</style><rect width="940" height="590" fill="#101a15"/><rect class="box" x="310" y="15" width="320" height="76"/><text class="label" x="328" y="45">Phone + Mac browser</text><text class="sub" x="328" y="70">Conversation and the decision inbox</text><rect class="box" x="310" y="135" width="320" height="76"/><text class="label" x="328" y="165">Forge</text><text class="sub" x="328" y="190">Policy, actions and delivery ownership</text><rect class="box" x="20" y="135" width="240" height="76"/><text class="label" x="38" y="165">Beans</text><text class="sub" x="38" y="190">Authored work and shared notes</text><rect class="box" x="680" y="135" width="240" height="76"/><text class="label" x="698" y="165">Crew</text><text class="sub" x="698" y="190">Pydantic AI · durable AG-UI</text><rect class="box" x="310" y="250" width="320" height="76"/><text class="label" x="328" y="280">Temporal</text><text class="sub" x="328" y="305">Delivery + coworker workflows</text><rect class="box" x="20" y="365" width="250" height="76"/><text class="label" x="38" y="395">Cloud authors</text><text class="sub" x="38" y="420">Eligible subscriptions</text><rect class="box" x="345" y="365" width="250" height="76"/><text class="label" x="363" y="395">Candidate PR + review</text><text class="sub" x="363" y="420">Independent review · exact SHA</text><rect class="box" x="670" y="365" width="250" height="76"/><text class="label" x="688" y="395">Verify</text><text class="sub" x="688" y="420">Linux + native Mac activities</text><rect class="box" x="670" y="485" width="250" height="76"/><text class="label" x="688" y="515">Shared k3s staging</text><text class="sub" x="688" y="540">Deploy · check · clean up</text><rect class="box" x="345" y="485" width="250" height="76"/><text class="label" x="363" y="515">Recheck merge gates</text><text class="sub" x="363" y="540">Evidence + required approvals</text><rect class="box" x="20" y="485" width="250" height="76"/><text class="label" x="38" y="515">Existing CI + health</text><text class="sub" x="38" y="540">Owner observes; pup + Datadog</text><path class="line" d="M470 91V135"/><path class="line" d="M310 173H260"/><path class="line" d="M630 173H680"/><path class="line" d="M800 135V115H140V135"/><path class="line" d="M470 211V250"/><path class="line" d="M800 211V288H630"/><path class="line" d="M390 326V345H145V365"/><path class="line" d="M270 403H345"/><path class="line" d="M595 403H670"/><path class="line" d="M795 441V485"/><path class="line" d="M670 523H595"/><path class="line" d="M345 523H270"/><text class="sub" x="490" y="108">AG-UI</text><text class="sub" x="680" y="100">Scoped note reads</text></svg>